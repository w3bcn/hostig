# Comprueba URLs y SHA-256 del catálogo. No forma parte de los checks del PR.
name: catalog-verify

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hostig-catalog
      - name: verify catalog urls and hashes
        id: verify
        continue-on-error: true
        run: cargo run -p hostig-runtimes --bin hostig-verify-catalog
      - name: open issue on failure
        if: steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Catálogo de runtimes: URL o hash no coinciden";
            const body = [
              "El workflow semanal `catalog-verify` falló.",
              "",
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "- Acción: revisar `catalog/runtimes.toml` y los checksums del publicador (ADR 0002).",
            ].join("\n");
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 50,
            });
            const existing = issues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Nuevo fallo: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: fail job if verify failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
