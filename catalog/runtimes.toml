# Catálogo fijado de runtimes (ADR 0002). Cambiar URL o hash es un commit revisado.
# Los SHA-256 de Windows x64 se contrastaron el 2026-10-22 contra el publicador:
# - Apache: .txt SHA-256 de Apache Lounge (VS18) + archivo descargado
# - PHP: releases.json de windows.php.net + archivo descargado
# - MariaDB: sha256sums.txt de archive.mariadb.org + archivo descargado

[[runtime]]
component = "apache"
version = "2.4.69"
os = "windows"
arch = "x86_64"
urls = [
  "https://www.apachelounge.com/download/VS18/binaries/httpd-2.4.69-261002-win64-VS18.zip",
]
filename = "httpd-2.4.69-261002-win64-VS18.zip"
sha256 = "77d715d0d9cee731e2251e7ddc2090a7a8e6d41fedef2e9827cd918593c5a652"
license = "Apache-2.0"
notes = "ZIP Win64 de Apache Lounge (VS18 / Visual Studio C++ 2026), no binario de la ASF. Exige el redistribuible VC++ 14.51+ (etiqueta Visual Studio 2017-2026). El ZIP no incluye esas DLL: el ADR 0002 manda llevarlas en la carpeta del runtime junto a httpd.exe (copia local desde el redistribuible, sin ejecutar vc_redist). SHA-256 recalculado 2026-10-28 sobre la URL del catálogo (el publicador regeneró el ZIP)."

