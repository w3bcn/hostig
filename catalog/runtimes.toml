# Catálogo fijado de runtimes (ADR 0002). Cambiar URL o hash es un commit revisado.
# Los SHA-256 de Windows x64 se contrastaron el 2026-10-22 contra el publicador:
# - Apache: .txt SHA-256 de Apache Lounge (VS18) + archivo descargado
# - PHP: releases.json de windows.php.net + archivo descargado
# - MariaDB: sha256sums.txt de archive.mariadb.org + archivo descargado

[[runtime]]
component = "apache"
version = "2.4.71"
os = "windows"
arch = "x86_64"
urls = [
  "https://www.apachelounge.com/download/VS18/binaries/httpd-2.4.71-261112-Win64-VS18.zip",
]
filename = "httpd-2.4.71-261112-Win64-VS18.zip"
sha256 = "44961a929dff16b767b3adbcea55760a942a00239b2891dc55806be34029e1fc"
license = "Apache-2.0"
notes = "ZIP Win64 de Apache Lounge (VS18 / Visual Studio C++ 2026), build 261112 del 12 Nov 2026, no binario de la ASF. Exige el redistribuible VC++ 14.51+ (etiqueta Visual Studio 2017-2026). SHA-256 contrastado 2026-11-26 con el fichero de checksums del publicador (httpd-2.4.71-261112-Win64-VS18.zip.txt, creado el 12.11.2026). La descarga del ZIP la verifica el CI contra este hash; la firma PGP (.asc, Steffen Land) se comprueba a mano antes de fusionar. Sustituye a 2.4.70-261106: el 2026-11-26 su URL ya servía otro contenido (SHA-256 c7b7d936…) y se descartó."

