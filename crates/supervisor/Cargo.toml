[package]
name = "hostig-supervisor"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Supervisor de Hostig. En la fase 0 solo acepta status y shutdown."

[lib]
name = "hostig_supervisor"
path = "src/lib.rs"

[dependencies]
hostig-ipc = { path = "../ipc" }
hostig-ports = { path = "../ports" }
hostig-processes = { path = "../processes" }
hostig-runtimes = { path = "../runtimes" }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
