[package]
name = "hostig-processes"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Supervisión de procesos de servidor y instancia MariaDB (ADR 0003)."

[[bin]]
name = "fake-mariadbd"
path = "src/bin/fake-mariadbd.rs"

[dependencies]
hostig-ipc = { path = "../ipc" }
hostig-ports = { path = "../ports" }
hostig-runtimes = { path = "../runtimes" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
hostig-ipc = { path = "../ipc" }
hostig-ports = { path = "../ports" }
hostig-runtimes = { path = "../runtimes" }
