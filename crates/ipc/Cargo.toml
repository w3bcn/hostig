[package]
name = "hostig-ipc"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "IPC local del supervisor: encuadre, testigo y transporte."

[dependencies]
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["socket", "fs", "user", "signal"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "3"
